<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Checkmark: short arm down-left to the vertex, long arm up-right -->
  <path d="M5 25 L17 37 L43 8" fill="none" stroke="#000" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A in the open space above the short arm -->
  <text x="12" y="20" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif"
        font-weight="bold" font-size="17" fill="#000">A</text>
  <!-- I in the space below the long arm -->
  <text x="33" y="42" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif"
        font-weight="bold" font-size="17" fill="#000">I</text>
</svg>
